name: deploy

# main → produkcja (wrangler deploy); inne gałęzie → wersja podglądowa (wrangler versions upload,
# noindex, szkice widoczne). Wymaga sekretów repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Bez sekretów workflow buduje i waliduje, ale pomija wdrożenie.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/guard.mjs

      - name: Build (produkcja)
        if: env.IS_MAIN == 'true'
        run: npm run build
      - name: Build (podgląd — szkice, noindex)
        if: env.IS_MAIN != 'true'
        run: npm run build
        env:
          PREVIEW: '1'

      - run: node scripts/guard.mjs
      - run: npm run validate

      - name: Alias podglądu z nazwy gałęzi
        id: alias
        if: env.IS_MAIN != 'true'
        run: |
          a=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
          echo "alias=${a:-preview}" >> "$GITHUB_OUTPUT"

      - name: Brak sekretów Cloudflare — pomijam wdrożenie
        if: env.HAS_CF != 'true'
        run: echo "::notice::Brak CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — build zwalidowany, wdrożenie pominięte (docs/cloudflare-checklist.md)."

      - name: Wdrożenie produkcji
        if: env.HAS_CF == 'true' && env.IS_MAIN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          command: deploy

      - name: Wersja podglądowa
        if: env.HAS_CF == 'true' && env.IS_MAIN != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}
